<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>embody watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ground:#0e1214; --panel:#13181b; --raise:#192024; --line:#232b2f; --line2:#2f393e; --ink:#e3eaec; --dim:#8d9a9e; --faint:#5d6a6e;
  --accent:hsl(175 70% 72%); --accent-bg:hsla(175 70% 72% / .13);
  --place:#3987e5; --creature:#d95926; --thing:#199e70; --other:#8d9a9e;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --bad:#d03b3b;
  --cool:#3987e5; --warm:#d03b3b; --mid:#383835;
  --r:2px; --u:4px; --t:120ms ease-out;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--ground); color:var(--ink); font:12px/1.4 var(--mono); font-variant-numeric:tabular-nums; }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; }
body { display:grid; grid-template-columns:1fr 372px; grid-template-rows:auto 1fr; height:100dvh; overflow:hidden; }

/* header: system status, search, view controls */
header { grid-column:1 / span 2; display:flex; align-items:center; gap:6px 14px; flex-wrap:wrap; padding:6px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
.brand { display:flex; align-items:center; gap:8px; min-width:0; }
.brand b { font:600 15px/1 var(--display); letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; }
.led { width:7px; height:7px; border-radius:50%; background:var(--faint); flex:none; }
.led.on { background:var(--accent); box-shadow:0 0 6px var(--accent); }
#wsel { max-width:200px; height:28px; background:var(--ground); border:1px solid var(--line2); border-radius:var(--r); }
.clock { display:flex; align-items:center; gap:6px; color:var(--dim); white-space:nowrap; }
.clock b { color:var(--ink); font-weight:500; }
#dial { width:22px; height:22px; flex:none; }
.search { display:flex; align-items:center; gap:0; flex:1 1 280px; min-width:220px; max-width:520px; }
.search input { flex:1; min-width:0; height:30px; padding:0 8px; background:var(--ground); border:1px solid var(--line2); border-right:none; border-radius:var(--r) 0 0 var(--r); }
.search input:focus, .search select:focus { outline:none; border-color:var(--accent); }
.search select { height:30px; max-width:130px; background:var(--ground); border:1px solid var(--line2); border-radius:0 var(--r) var(--r) 0; padding:0 4px; }
.seg { display:flex; border:1px solid var(--line2); border-radius:var(--r); overflow:hidden; }
.seg button { height:28px; padding:0 10px; background:transparent; border:none; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; font-size:10.5px; }
.seg button + button { border-left:1px solid var(--line2); }
.seg button.on { background:var(--accent-bg); color:var(--accent); }
.depth { display:flex; align-items:center; gap:2px; color:var(--dim); }
.depth button { width:28px; height:28px; background:transparent; border:1px solid var(--line2); border-radius:var(--r); color:var(--ink); }
.depth span { min-width:58px; text-align:center; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; }
.depth b { color:var(--ink); font-weight:500; }
#err { color:var(--serious); }
#auth input { height:28px; padding:0 6px; background:var(--ground); border:1px solid var(--line2); border-radius:var(--r); width:220px; }
#auth button, .btn { height:28px; padding:0 10px; background:var(--raise); border:1px solid var(--line2); border-radius:var(--r); }
.btn:hover, #auth button:hover, .depth button:hover { border-color:var(--dim); }

/* the stage: one svg, two views, html overlays for trays and the scale */
main { position:relative; overflow:hidden; min-width:0; min-height:0; touch-action:none; cursor:grab; }
main.drag { cursor:grabbing; }
#crumbs { position:absolute; left:10px; top:8px; right:120px; display:flex; flex-wrap:wrap; gap:2px; z-index:3; pointer-events:none; }
#crumbs button { pointer-events:auto; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); color:var(--dim); padding:3px 7px; font-size:11px; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#crumbs button:last-child { color:var(--ink); border-color:var(--line2); }
#crumbs .sep { color:var(--faint); align-self:center; padding:0 1px; }
#tools { position:absolute; right:10px; top:8px; display:flex; flex-direction:column; gap:4px; z-index:3; }
#tools button { width:32px; height:32px; background:var(--panel); border:1px solid var(--line2); border-radius:var(--r); color:var(--ink); font-size:15px; line-height:1; }
#tools button:hover { border-color:var(--dim); }
svg#svg { display:block; width:100%; height:100%; }
#overlay { position:absolute; inset:0; pointer-events:none; z-index:2; }
#note { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); color:var(--dim); text-align:center; max-width:360px; z-index:2; pointer-events:none; }
#scale { position:absolute; left:12px; bottom:12px; z-index:3; color:var(--dim); font-size:10.5px; pointer-events:none; display:flex; align-items:flex-end; gap:12px; }
#scale .bar { height:6px; border:1px solid var(--dim); border-top:none; }
#scale .north { width:18px; text-align:center; color:var(--ink); }
#tally { position:absolute; right:10px; bottom:10px; z-index:3; color:var(--faint); font-size:10.5px; pointer-events:none; text-align:right; }

/* the past: a bar to drag through the log; the stage wears a warning edge while it shows a moment gone */
#pastbtn.on { border-color:var(--warn); color:var(--warn); }
#scrub { position:absolute; left:50%; transform:translateX(-50%); bottom:34px; z-index:5; width:min(660px, calc(100% - 24px)); background:var(--panel); border:1px solid var(--warn); border-radius:var(--r); padding:6px 8px 8px; display:grid; grid-template-columns:auto 1fr auto; gap:6px 8px; align-items:center; touch-action:auto; cursor:default; }
#scrub[hidden] { display:none; }
#scrub .when { grid-column:1 / -1; display:flex; align-items:center; gap:8px; color:var(--dim); font-size:11px; min-width:0; }
#scrub .when b { color:var(--warn); font-weight:500; white-space:nowrap; }
#scrub .when span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
#scrub input[type=range] { width:100%; accent-color:hsl(40 95% 54%); height:28px; margin:0; }
#scrub button { min-width:40px; height:30px; padding:0 8px; background:var(--raise); border:1px solid var(--line2); border-radius:var(--r); font-size:11px; }
#scrub button:hover { border-color:var(--dim); }
#scrub .ends { grid-column:1 / -1; display:flex; justify-content:space-between; color:var(--faint); font-size:10px; margin-top:-4px; }
body.past main { outline:2px solid var(--warn); outline-offset:-2px; }
.node.changed rect.box { stroke:var(--warn); }
.area.changed, .mark.changed { stroke:var(--warn) !important; stroke-width:2.2; }

/* tree boxes */
.node { cursor:pointer; }
.node rect.box { fill:var(--panel); stroke:var(--line2); stroke-width:1; }
.node rect.bar { stroke:none; }
.node text { fill:var(--ink); font:600 12.5px var(--display); pointer-events:none; }
.node text.sub { fill:var(--dim); font:400 10.5px var(--mono); }
.node text.stat { fill:var(--dim); font:400 10.5px var(--mono); }
.node text.stat.bad { fill:var(--serious); }
.node text.seat { fill:var(--accent); font:500 10px var(--mono); }
.node text.seat.away { fill:var(--faint); }
.node .more { fill:var(--raise); stroke:var(--line2); }
.node text.morel { fill:var(--accent); font:500 10.5px var(--mono); }
.node.hidden rect.box { stroke-dasharray:4 3; } .node.hidden text { opacity:.6; }
.node.dead rect.box, .node.down rect.box { stroke:var(--bad); }
.node.sel rect.box { stroke:var(--accent); stroke-width:2; }
.node.hit rect.box { stroke:var(--accent); stroke-width:2; fill:#16211f; }
.node.changed rect.box { fill:#1c2a28; transition:fill 900ms ease-out; }
.dimmed { opacity:.28; }
.tree { stroke:var(--line2); stroke-width:1.2; fill:none; }
.conn { stroke:var(--place); stroke-width:1.6; fill:none; opacity:.75; }
.rel { stroke:var(--dim); stroke-width:1.2; fill:none; stroke-dasharray:5 4; }
.lbl { fill:var(--dim); font:400 10px var(--mono); }

/* map */
.area { stroke-width:1.4; vector-effect:non-scaling-stroke; cursor:pointer; }
.area.k-place { stroke:var(--place); fill:rgba(57,135,229,.07); }
.area.k-creature { stroke:var(--creature); fill:rgba(217,89,38,.10); }
.area.k-thing { stroke:var(--thing); fill:rgba(25,158,112,.10); }
.area.k-other { stroke:var(--other); fill:rgba(141,154,158,.06); stroke-dasharray:5 4; }
.area.focus { fill:rgba(255,255,255,.015); stroke:var(--line2); stroke-dasharray:2 4; cursor:default; }
.area.deep { fill-opacity:.4; stroke-opacity:.7; }
.area.sel, .mark.sel { stroke:var(--accent) !important; stroke-width:2.6; }
.area.hit { stroke:var(--accent) !important; stroke-width:2.4; fill:var(--accent-bg); }
.mark { stroke:var(--ground); stroke-width:1.2; vector-effect:non-scaling-stroke; cursor:pointer; }
.mark.k-place { fill:var(--place); } .mark.k-creature { fill:var(--creature); } .mark.k-thing { fill:var(--thing); } .mark.k-other { fill:var(--other); }
.mark.hit { stroke:var(--accent); stroke-width:2.4; }
.mark.inh { fill:none; stroke-dasharray:2 2; }
.road { stroke:#c8d2d4; stroke-opacity:.45; stroke-width:1.6; fill:none; vector-effect:non-scaling-stroke; }
.road.hidden { stroke-dasharray:4 4; }
.mlbl { fill:var(--ink); font-family:var(--mono); paint-order:stroke; stroke:var(--ground); stroke-width:3px; stroke-linejoin:round; pointer-events:none; }
.mlbl.l1 { font-family:var(--display); font-weight:600; }
.mlbl.deep { fill:var(--dim); }
.tray { position:absolute; pointer-events:auto; background:rgba(14,18,20,.92); border:1px dashed var(--line2); border-radius:var(--r); padding:4px; max-width:260px; display:flex; flex-wrap:wrap; gap:3px; }
.tray .cap { width:100%; color:var(--faint); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; padding:0 2px 2px; display:flex; justify-content:space-between; gap:6px; align-items:center; }
.tray .cap button { background:none; border:none; color:var(--dim); font-size:14px; line-height:1; padding:0 2px; min-width:22px; min-height:22px; }
.tray.shut { padding:0; border:none; background:none; }
.tray.shut .chip { background:rgba(14,18,20,.88); color:var(--dim); font-size:10.5px; }
.chip { display:inline-flex; align-items:center; gap:5px; max-width:100%; padding:2px 6px; border:1px dashed var(--line2); border-radius:var(--r); background:transparent; color:var(--ink); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chip.solid { border-style:solid; }
.chip.hit { border-color:var(--accent); color:var(--accent); border-style:solid; }
.chip.sel { background:var(--accent-bg); border-color:var(--accent); }
.chip i { width:7px; height:7px; flex:none; display:inline-block; }
.kd-place { background:var(--place); } .kd-creature { background:var(--creature); border-radius:50%; } .kd-thing { background:var(--thing); transform:rotate(45deg) scale(.85); } .kd-other { border:1px dashed var(--other); }

/* the side panel: one tab at a time */
aside { border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; background:var(--panel); }
.tabs { display:flex; border-bottom:1px solid var(--line); flex:none; }
.tabs button { flex:1; height:36px; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--dim); text-transform:uppercase; letter-spacing:.09em; font-size:10.5px; }
.tabs button.on { color:var(--ink); border-bottom-color:var(--accent); }
.tabs button em { font-style:normal; color:var(--accent); margin-left:4px; }
.tabs button em#an { color:var(--serious); }
.pane { flex:1; overflow:auto; min-height:0; display:none; }
.pane.on { display:block; }
.grab { display:none; }
.cap, h4 { margin:0; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:500; }
.sec { padding:10px 12px; border-bottom:1px solid var(--line); }
.sec h4 { margin-bottom:6px; display:flex; justify-content:space-between; gap:8px; }
.empty { padding:24px 14px; color:var(--dim); }
.title { display:flex; align-items:flex-start; gap:10px; }
.title .sw { width:4px; align-self:stretch; border-radius:1px; flex:none; }
.title h2 { margin:0; font:700 17px/1.2 var(--display); word-break:break-word; }
.title .meta { color:var(--dim); margin-top:3px; display:flex; flex-wrap:wrap; gap:4px 8px; }
.title .meta button { background:none; border:none; padding:0; color:var(--dim); text-decoration:underline dotted; }
.badges { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
.badge { padding:1px 6px; border-radius:var(--r); border:1px solid var(--line2); font-size:10.5px; color:var(--dim); }
.badge.critical { border-color:var(--bad); color:#f08a8a; } .badge.serious { border-color:var(--serious); color:var(--serious); }
.badge.warning { border-color:var(--warn); color:var(--warn); } .badge.good { border-color:var(--good); color:#5fd35f; }
.meter { display:grid; grid-template-columns:52px 1fr 64px; align-items:center; gap:8px; margin:4px 0; }
.meter .track { height:6px; background:var(--ground); border:1px solid var(--line); border-radius:1px; overflow:hidden; }
.meter .fill { height:100%; background:var(--dim); }
.meter .fill.low { background:var(--serious); } .meter .fill.crit { background:var(--bad); }
.meter span:last-child { text-align:right; }
.chips { display:flex; flex-wrap:wrap; gap:4px; }
.chips .chip { border-style:solid; cursor:pointer; }
.chips .chip:hover { border-color:var(--dim); }
.rels { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; align-items:start; }
.rels .rn { color:var(--dim); white-space:nowrap; padding-top:2px; }
.kv { display:grid; grid-template-columns:minmax(80px,auto) 1fr; gap:3px 10px; }
.kv > span:nth-child(odd) { color:var(--dim); word-break:break-all; }
.kv > span:nth-child(even) { word-break:break-word; }
.kv details summary { cursor:pointer; color:var(--dim); }
.kv pre, pre.raw { margin:4px 0 0; white-space:pre-wrap; word-break:break-word; color:var(--dim); font-size:11px; }
.acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.peer { display:grid; grid-template-columns:minmax(70px,auto) 1fr 46px; gap:4px 8px; align-items:center; }
.peer .zbar { position:relative; height:10px; background:var(--ground); border:1px solid var(--line); }
.peer .zbar i { position:absolute; top:0; bottom:0; }
.peer .zbar b { position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:var(--faint); }

/* results and stats */
.rlist { list-style:none; margin:0; padding:0; }
.rlist li { display:grid; grid-template-columns:10px 1fr auto; gap:8px; align-items:center; padding:6px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
.rlist li:hover { background:var(--raise); }
.rlist li.sel { background:var(--accent-bg); }
.rlist .nm { font:600 12.5px var(--display); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rlist .wh { color:var(--dim); font-size:10.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rlist .ty { color:var(--faint); font-size:10.5px; }
.stat { display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:8px 12px; border-bottom:1px solid var(--line); }
.stat .an { font-weight:500; }
.stat .nums { color:var(--dim); text-align:right; font-size:11px; }
.stat svg { grid-column:1 / span 2; width:100%; height:26px; }
.stat svg .dot { fill:var(--dim); } .stat svg .dot.me { fill:var(--accent); }
.stat svg .band { fill:rgba(141,154,158,.12); } .stat svg .mean { stroke:var(--ink); stroke-width:1.5; } .stat svg .axis { stroke:var(--line2); }
table.z { border-collapse:collapse; width:100%; font-size:11px; }
table.z th, table.z td { padding:4px 6px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
table.z th { color:var(--faint); font-weight:500; font-size:10px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; position:sticky; top:0; background:var(--panel); }
table.z th.on { color:var(--accent); }
table.z td:first-child, table.z th:first-child { text-align:left; max-width:120px; overflow:hidden; text-overflow:ellipsis; }
table.z tr:hover td { background:var(--raise); }
table.z tr { cursor:pointer; }
.legend { display:flex; gap:10px; align-items:center; color:var(--dim); font-size:10.5px; flex-wrap:wrap; }
.legend i { display:inline-block; width:22px; height:8px; vertical-align:middle; margin-right:4px; }

/* events and seats */
.filters { display:flex; flex-wrap:wrap; gap:4px; padding:8px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:1; }
.filters button { padding:3px 8px; background:transparent; border:1px solid var(--line2); border-radius:var(--r); color:var(--dim); font-size:11px; }
.filters button.on { border-color:var(--accent); color:var(--accent); }
.ev { padding:5px 12px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:52px 1fr; gap:8px; }
.ev .t { color:var(--faint); }
.ev .k { color:var(--accent); font-size:10.5px; }
.ev .ln { word-break:break-word; }
.ev .pl { color:var(--dim); word-break:break-word; font-size:11px; }
.ev.new .t { color:var(--accent); }
.ev button { background:none; border:none; padding:0; color:var(--ink); text-decoration:underline dotted var(--faint); }
.seat { display:grid; grid-template-columns:10px 1fr auto; gap:8px; align-items:center; padding:7px 12px; border-bottom:1px solid var(--line); }
.seat .nm { font:600 12.5px var(--display); }
.seat .wh { color:var(--dim); font-size:11px; }
.seat button { background:none; border:none; padding:0; color:var(--dim); text-decoration:underline dotted; }

@media (max-width: 760px) {
  body { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
  header { grid-column:1; gap:6px 8px; padding:6px 10px; }
  .brand b { max-width:140px; }
  .search { order:5; flex:1 1 100%; max-width:none; }
  #counts { display:none; }
  aside { position:fixed; left:0; right:0; bottom:0; height:56dvh; border-left:none; border-top:1px solid var(--line2); z-index:20; transform:translateY(calc(100% - 40px)); transition:transform var(--t); }
  aside.open { transform:none; }
  .grab { display:block; height:14px; flex:none; position:relative; }
  .grab::after { content:""; position:absolute; left:50%; top:5px; width:40px; height:4px; margin-left:-20px; border-radius:2px; background:var(--line2); }
  .tabs button { height:40px; }
  #scale { bottom:52px; } #tally { bottom:52px; max-width:58%; }
  #scrub { bottom:50px; }
  #crumbs { right:52px; }
  #tools button { width:40px; height:40px; }
  .rlist li, .seat { padding:9px 12px; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="led" id="led" title="clock"></span><b id="wname">embody watch</b><select id="wsel" title="which world to watch" hidden></select></div>
  <div class="clock" title="world time"><svg id="dial" viewBox="-12 -12 24 24" aria-hidden="true"></svg><span id="clock"></span></div>
  <label class="search"><input id="q" type="search" placeholder="search: name, or hp<3, faction:keth, is:dead" autocomplete="off" spellcheck="false" aria-label="search"><select id="qt" aria-label="type"></select></label>
  <div class="seg" role="tablist"><button id="vtree" class="on">tree</button><button id="vmap">map</button></div>
  <div class="depth"><button id="dless" aria-label="less depth">&minus;</button><span>depth <b id="dval">1</b></span><button id="dmore" aria-label="more depth">+</button></div>
  <button id="pastbtn" class="btn" title="drag back through the world's history">history</button>
  <span id="counts" style="color:var(--faint)"></span>
  <span id="err"></span>
  <span id="auth" hidden><input id="tok" type="password" placeholder="your invite token" autocomplete="off"> <button id="tokgo">watch</button></span>
</header>
<main id="stage">
  <div id="crumbs"></div>
  <div id="tools"><button id="zin" title="zoom in">+</button><button id="zout" title="zoom out">&minus;</button><button id="zfit" title="fit (double-click empty space)">&#x2922;</button><button id="up" title="up one level">&uarr;</button></div>
  <svg id="svg"><g id="view"></g></svg>
  <div id="overlay"></div>
  <div id="note"></div>
  <div id="scale"></div>
  <div id="scrub" hidden>
    <div class="when"><b id="pwhen"></b><span id="pago"></span><button id="pplay">play</button><button id="pnow">now</button></div>
    <button id="pback" title="an hour back">&minus;1h</button><input id="prange" type="range" aria-label="when"><button id="pfwd" title="an hour on">+1h</button>
    <div class="ends"><span id="pfirst"></span><span id="plast"></span></div>
  </div>
  <div id="tally"></div>
</main>
<aside id="side">
  <div class="grab" id="grab"></div>

  <div class="pane on" id="p-ent"><div class="empty">Tap something to read it here. Double-tap a place to go inside it.</div></div>
  <div class="pane" id="p-res"><div class="empty">Search to gather a set: by name, or by state (<b>hp&lt;3</b>, <b>water&lt;=2</b>, <b>faction:keth</b>, <b>is:dead</b>, <b>has:layout</b>), narrowed by type. The set gets its numbers here: mean, spread, and how far each one stands from the rest.</div></div>

<script>

// ---------------------------------------------------------------- feed: the page holds the world and asks for changes

const BASE = /\/watch\/?$/.test(location.pathname) ? location.pathname.replace(/\/$/, "") : "";
const $ = id => document.getElementById(id);
let token = null;

const H0 = location.hash.slice(1);

(function readHash() {

  const p = new URLSearchParams(h);
  if (p.get("w")) W.id = p.get("w");
  if (p.get("e")) V.sel = p.get("e");
  if (p.get("f")) V.focus = p.get("f");
  if (p.get("v") === "map") V.view = "map";

function syncControls() {

async function get(path) {

    const b = await r.json().catch(() => ({}));
    $("auth").hidden = false;
    $("err").textContent = r.status === 401 ? (token ? "that token does not open this world: paste a live one" : "paste your invite token to watch") : (b.reason || "this grant may not watch");

function useToken() {

  try { sessionStorage.setItem("embody-token", token); } catch (e) {}

}
function resetWorld(id) {
  Object.assign(W, { id, info: null, ents: new Map(), kids: new Map(), edges: [], hyper: [], schemas: {}, spaces: {}, prin: [],

let knownWorlds = "";

let polling = false;
async function poll() {

    let q = "/state.json?limit=" + (W.maxSeq ? 200 : 150) + "&since=" + W.maxSeq;
    if (want) q += "&world=" + encodeURIComponent(want);
    if (W.after !== null) q += "&after=" + W.after + "&sig=" + encodeURIComponent(W.sig || "");
    const d = await get(q);
    if (!d.ok) { $("err").textContent = d.reason; return; }

function merge(d) {

  for (const e of d.entities) {
    const old = W.ents.get(e.id);

    if (old && !first) V.changed.add(e.id);

  $("an").textContent = alerts ? String(alerts) : "";

  if (V.q || V.qt) { if (touched) runSearch(false); }
  if (first || touched) schedule(first);
  if (first || touched || V.tab !== "ent") panel(first || fresh.length > 0 || touched);

function index() {
  W.kids = new Map(); W.byType = new Map();
  for (const e of W.ents.values()) {
    if (e.parent && W.ents.has(e.parent)) { let a = W.kids.get(e.parent); if (!a) W.kids.set(e.parent, a = []); a.push(e.id); }
    let t = W.byType.get(e.type); if (!t) W.byType.set(e.type, t = []); t.push(e.id);
  }
  W.edgesBy = new Map();
  for (const ed of W.edges) for (const id of [ed.source, ed.target]) { let a = W.edgesBy.get(id); if (!a) W.edgesBy.set(id, a = []); a.push(ed); }
  W.counts = new Map();   // descendants under each entity, for the "+N" on a closed box
  const count = id => { let n = 0; for (const k of W.kids.get(id) || []) n += 1 + count(k); W.counts.set(id, n); return n; };
  if (W.info && W.ents.has(W.info.root)) count(W.info.root);

// ---------------------------------------------------------------- small readers
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function kidsOf(id) { return W.kids.get(id) || []; }
function kindOf(type) {

  while (t && g++ < 30) { if (t === "place" || t === "creature" || t === "thing") { k = t; break; } t = W.schemas[t]; }
  W.kindMemo.set(type, k); return k;
}
function num(v) { return v === undefined || v === null || v === "" || typeof v === "boolean" ? null : (Number.isFinite(Number(v)) ? Number(v) : null); }
function label(e) { if (!e) return ""; const c = num((e.state || {}).count); return (e.name || e.type) + (c !== null ? " ×" + c : ""); }

function short(s, n) { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function ancestors(id) { const out = []; let e = ent(id), g = 0; while (e && e.parent && g++ < 200) { out.unshift(e.parent); e = ent(e.parent); } return out; }

function lca(ids) {

  return path.length ? path[path.length - 1] : W.info.root;
}
function hm(sec) { sec = Math.max(0, sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); return h ? h + "h" + String(m).padStart(2, "0") : m + "m"; }
function ago(sec) { return sec < 90 ? Math.round(sec) + "s" : sec < 5400 ? Math.round(sec / 60) + "m" : (sec / 3600).toFixed(1) + "h"; }

// one readable condition, the engine's own words where it has them
function condition(e) {

  else if (st.down) out.push([st.downed_by === "thirst" ? "down, thirst" : "down", "critical"]);
  else if (st.wounded) out.push(["hurt", "serious"]);
  if (st.fading) out.push(["fading " + st.fading, "critical"]);
  if (st.asleep) out.push(["asleep", ""]);
  if (st.thirsty) out.push(["thirsty", "warning"]);

  if (num(st.water) !== null && kindOf(e.type) === "creature") bits.push("w " + st.water + "/" + (st.max_water ?? 10));

// ---------------------------------------------------------------- header: clock, dial, counts

  const clock24 = Math.floor(frac * 24), min = Math.floor((frac * 24 - clock24) * 60);

  $("led").className = "led" + (w.running && !V.past ? " on" : "");

// ---------------------------------------------------------------- camera: one per view, pan and pinch and wheel

    (ids.length > 300 ? `<div class="empty">the first 300 of ${ids.length}: narrow the search</div>` : "");
  el.innerHTML = h; wireRes(el);
}
function wireRes(el) {
  wire(el);
  el.querySelectorAll("tr[data-go], li[data-go]").forEach(r => r.onclick = () => { V.sel = r.dataset.go; markSel(); writeHash(); paneResults(); });
  el.querySelectorAll("th[data-sort]").forEach(t => t.onclick = () => { if (V.sortKey === t.dataset.sort) V.sortDir *= -1; else { V.sortKey = t.dataset.sort; V.sortDir = -1; } paneResults(); });
  const f = $("rfit"); if (f) f.onclick = () => fitHits();
  const c = $("rclear"); if (c) c.onclick = () => clearSearch();
}
// events: the story by default, the bookkeeping on request
const EVF = {
  story: k => !/^(moved|left|act|before_act|finished|embodied|released|patched|scheduled|unscheduled|tick|finish|spawned|destroyed|linked|unlinked|related|unrelated|rule_set|rule_cleared|schema_defined|script_defined|layout|moved_by_author|chronicled)$/.test(k),
  talk: k => /^(say|talked|parley|agreed|threatened|cowed)$/.test(k),
  fights: k => /^(hit|missed|warded|downed|wounded|killed|died|rose|attacked|struck|challenged|yielded|dishonor|fading)$/.test(k),
  moves: k => /^(arrived|left|taken|dropped|given|put|passing|pulled_in)$/.test(k),
  alerts: k => /^(act_refused|rejected|denied|script_error|died|killed|downed|fading)$/.test(k),
  all: () => true
};
function line(ev) {
  const p = ev.payload || {}, a = ev.actor ? nameOf(ev.actor) : "", t = ev.target ? nameOf(ev.target) : "", by = p.by ? nameOf(p.by) : a, n = p.count ? p.count + " " : "";
  switch (ev.kind) {
    case "say": return `${a}${p.to ? " to " + nameOf(p.to) : ""}: “${short(p.text || "", 220)}”`;
    case "talked": return `${by} asks ${t} about ${p.about || "nothing in particular"}`;
    case "arrived": return `${nameOf(p.who || ev.actor)} arrived at ${nameOf(p.place || ev.target)}${p.quiet ? " (quiet)" : ""}`;
    case "taken": return `${by} took ${n}${nameOf(p.item || ev.target)}`;
    case "dropped": return `${by} dropped ${n}${nameOf(p.item || ev.target)}`;
    case "given": return `${by} gave ${n}${nameOf(p.item)} to ${t}`;
    case "put": return `${by} put ${n}${nameOf(p.item)} in ${t}`;
    case "hit": return `${by} hit ${t} for ${p.dmg}${p.weapon ? " with " + p.weapon : ""} (${p.attack} vs ${p.defence})`;
    case "missed": return `${by} missed ${t} (${p.attack} vs ${p.defence})`;
    case "downed": return `${t} went down` + (p.by ? " (" + nameOf(p.by) + ")" : "");
    case "died": return `${t} died` + (p.why ? " of " + p.why : "");
    case "fading": return `${t} is fading, day ${p.day} of ${p.of}`;
    case "rose": return `${t} is back on their feet`;
    case "woke": return `${t} woke` + (p.why ? " (" + p.why + ")" : "");
    case "slept": return `${t} fell asleep`;
    case "checked": return `${nameOf(p.by || ev.actor)} ${p.skill || "check"}: ${p.total} vs ${p.dc}, ${p.success ? "pass" : "fail"}`;
    case "act_refused": return `${a || t} tried ${p.verb}${p.asked ? " " + p.asked : ""}: ${p.reason || "refused"}`;
    case "renamed": return `${p.old} is now ${p.new}`;
  }
  return null;
}
function paneEvents() {
  const el = $("p-evs"), f = EVF[V.evFilter] || EVF.story, me = V.evMine && V.sel;
  const rows = W.events.filter(ev => f(ev.kind) && (!me || ev.actor === me || ev.target === me || (ev.payload && (ev.payload.by === me || ev.payload.who === me || ev.payload.to === me)))).slice(-250).reverse();
  let h = `<div class="filters">${Object.keys(EVF).map(k => `<button data-f="${k}" class="${V.evFilter === k ? "on" : ""}">${k}</button>`).join("")}` +
    (V.sel ? `<button data-mine="1" class="${me ? "on" : ""}" title="only what touched the selected one">${esc(short(nameOf(V.sel), 14))}</button>` : "") + `</div>`;
  if (!rows.length) h += `<div class="empty">Nothing ${V.evFilter === "all" ? "" : "of this kind "}in the last ${W.events.length} events.</div>`;
  const day = W.info.day_seconds || 86400;
  for (const ev of rows) {
    const ln = (() => { try { return line(ev); } catch (x) { return null; } })(), tod = ((ev.t % day) + day) % day / day * 24;
    const tt = String(Math.floor(tod)).padStart(2, "0") + ":" + String(Math.floor((tod % 1) * 60)).padStart(2, "0");
    const who = [ev.actor, ev.target].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i);
    h += `<div class="ev${ev.seq > V.seenSeq ? " new" : ""}" title="#${ev.seq} · reach ${ev.reach}"><span class="t">${tt}</span><div><span class="k">${esc(ev.kind)}</span> ` +
      (ln ? `<div class="ln">${esc(ln)}</div>` : `${who.map(id => `<button data-go="${esc(id)}">${esc(short(nameOf(id), 24))}</button>`).join(" → ")}${ev.payload && Object.keys(ev.payload).length ? `<div class="pl">${esc(short(JSON.stringify(ev.payload), 160))}</div>` : ""}`) + `</div></div>`;
  }
  el.innerHTML = h; wire(el);
  el.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { V.evFilter = b.dataset.f; paneEvents(); });
  el.querySelectorAll("[data-mine]").forEach(b => b.onclick = () => { V.evMine = !V.evMine; paneEvents(); });
  V.seenSeq = W.maxSeq;
  if (V.evFilter === "alerts" || V.evFilter === "all") { V.alertSeen = W.maxSeq; $("an").textContent = ""; }
}
function paneSeats() {
  const el = $("p-seats"), w = W.info;
  const rows = W.prin.slice().sort((a, b) => (seatIdle(a) - seatIdle(b)) || String(a.label || a.name).localeCompare(String(b.label || b.name)));
  if (!rows.length) { el.innerHTML = `<div class="empty">Nobody holds a seat in this world.</div>`; return; }
  el.innerHTML = rows.map(p => { const idle = seatIdle(p); return `<div class="seat"><span class="led${idle ? "" : " on"}"></span><div style="min-width:0"><div class="nm">${esc(p.label || p.name || p.id)}</div>` +
    `<div class="wh">${esc(p.role || p.kind || "")}${p.entity ? " · " : ""}${p.entity ? `<button data-go="${esc(p.entity)}">${esc(nameOf(p.entity))}</button>` : " · no body"}</div></div>` +
    `<span class="wh">${idle ? "away" : "in play"}${p.last_seen ? "<br>" + ago(w.now - p.last_seen) + " ago" : ""}</span></div>`; }).join("");
  wire(el);
}

// ---------------------------------------------------------------- history: the world as it stood, rebuilt by the server from the log
function clockAt(t) {
  const day = (W.info && W.info.day_seconds) || 86400, tod = ((t % day) + day) % day / day * 24;
  return "day " + (Math.floor(t / day) + 1) + " " + String(Math.floor(tod)).padStart(2, "0") + ":" + String(Math.floor((tod % 1) * 60)).padStart(2, "0");
}
function openPast(on) {
  PAST.open = on; $("scrub").hidden = !on; $("pastbtn").classList.toggle("on", on);
  if (!on) backToNow();
  else { if (PAST.t === null) PAST.t = W.nowT; pastUI(); }
}
function pastUI() {
  const lo = W.first ? W.first.t : W.nowT, hi = W.nowT, r = $("prange");
  r.min = Math.floor(lo); r.max = Math.ceil(hi); r.step = 60;
  if (!r.matches(":active")) r.value = PAST.t ?? hi;
  const t = Number(r.value), back = hi - t;
  $("pwhen").textContent = V.past || back > 30 ? clockAt(t) : "now";
  $("pago").textContent = back > 30 ? hm(back) + " of world time ago" + (V.past ? " \u00b7 event " + V.past.seq : "") : "drag back to see the world as it stood";
  $("pfirst").textContent = clockAt(lo) + " (first event)"; $("plast").textContent = clockAt(hi);
  $("pplay").textContent = PAST.playing ? "pause" : "play";
}
async function goPast(t) {
  PAST.t = t;
  if (t >= W.nowT - 30) { backToNow(); return; }
  if (PAST.busy) { PAST.again = true; return; }
  PAST.busy = true;
  try {
    const d = await get("/state.json?limit=200&world=" + encodeURIComponent(W.id) + "&at_t=" + t.toFixed(3));
    if (d.ok && PAST.open) loadPast(d);
  } catch (e) { if (!e.auth) $("err").textContent = "no server: " + e.message; }
  finally { PAST.busy = false; }
  if (PAST.again) { PAST.again = false; goPast(PAST.t); }
}
function loadPast(d) {
  // what moved, changed hands or changed state since the last moment shown lights up
  const before = W.ents;
  V.changed = new Set();
  W.ents = new Map();
  for (const e of d.entities) {
    const o = before.get(e.id);
    if (!o || o.parent !== e.parent || o.name !== e.name || JSON.stringify(o.state) !== JSON.stringify(e.state)) if (before.size) V.changed.add(e.id);
    W.ents.set(e.id, e);
  }
  V.past = d.at;
  W.info = Object.assign({}, d.world, { t: d.at.t });
  W.edges = d.edges || W.edges; W.hyper = d.hyperedges || W.hyper; W.schemas = d.schemas || W.schemas; W.spaces = d.spaces || W.spaces; W.kindMemo.clear();
  W.events = d.events || []; W.after = null; W.sig = null; W.maxSeq = 0;
  document.body.classList.add("past");
  index();
  if (!W.ents.has(V.focus)) V.focus = W.info.root;
  header();
  if (V.q || V.qt) runSearch(false);
  schedule(false); panel(true); pastUI(); writeHash();
}
function backToNow() {
  stopPlay();
  const was = V.past; V.past = null; PAST.t = W.nowT ?? PAST.t;
  document.body.classList.remove("past");
  if (was) { W.after = null; W.sig = null; W.maxSeq = 0; W.events = []; V.changed = new Set(); writeHash(); poll(); }
  if (PAST.open) pastUI();
}
function stopPlay() { if (PAST.playing) { clearInterval(PAST.playing); PAST.playing = null; } }
(function wirePast() {
  const r = $("prange");
  $("pastbtn").onclick = () => openPast(!PAST.open);
  r.addEventListener("input", () => { stopPlay(); PAST.t = Number(r.value); pastUI(); clearTimeout(r.dt); r.dt = setTimeout(() => goPast(PAST.t), 250); });
  $("pback").onclick = () => { stopPlay(); goPast(Math.max(Number(r.min), (PAST.t ?? W.nowT) - 3600)); pastUI(); };
  $("pfwd").onclick = () => { stopPlay(); goPast(Math.min(W.nowT, (PAST.t ?? W.nowT) + 3600)); pastUI(); };
  $("pnow").onclick = () => backToNow();
  // play: ten world minutes a step, the next step once the last one came back
  $("pplay").onclick = () => {
    if (PAST.playing) { stopPlay(); pastUI(); return; }
    if ((PAST.t ?? W.nowT) >= W.nowT - 30) PAST.t = Math.max(Number(r.min), W.nowT - 6 * 3600);
    PAST.playing = setInterval(() => { if (!PAST.busy) { const t = PAST.t + 600; if (t >= W.nowT) backToNow(); else { goPast(t); pastUI(); } } }, 700);
    goPast(PAST.t); pastUI();
  };
  ["pointerdown", "wheel"].forEach(k => $("scrub").addEventListener(k, ev => ev.stopPropagation(), { passive: true }));
})();

syncControls();
poll();
(function loop() { setTimeout(() => { if (!document.hidden || Date.now() % 15000 < 2100) poll(); loop(); }, 2000); })();
</script>
