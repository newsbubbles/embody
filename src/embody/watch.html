<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>embody watch</title>
<style>
:root { --bg:#0f1115; --panel:#161a22; --line:#2a3140; --ink:#e6e9ef; --dim:#8a93a6; --place:#3b7dd8; --creature:#d8903b;
  --thing:#5fb37a; --other:#9b7bd8; --hot:#ff5d73; --me:#ffd166; font-family: ui-sans-serif, system-ui, sans-serif; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); }
body { display:grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr; height:100vh; }
header { grid-column: 1 / span 2; display:flex; flex-wrap:wrap; align-items:center; gap:4px 18px; padding:8px 14px; border-bottom:1px solid var(--line); font-size:13px; }
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 52vh 1fr; }
  header { grid-column: 1; }
  aside { border-left:none; border-top:1px solid var(--line); }
}
header b { font-size:15px; } header .dim { color:var(--dim); }
header .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); display:inline-block; margin-right:6px; }
header .dot.run { background:var(--thing); box-shadow:0 0 8px var(--thing); }
#graph { position:relative; overflow:hidden; cursor:grab; }
#graph.dragging { cursor:grabbing; }
svg { display:block; width:100%; height:100%; }
#zoom { position:absolute; right:10px; top:10px; display:flex; gap:4px; }
#zoom button { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:3px 9px; font-size:12px; cursor:pointer; }
#zoom button:hover { border-color:var(--dim); }
header select, header input, header button { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:3px 6px; font-size:13px; }
header button { cursor:pointer; } header button:hover { border-color:var(--dim); }
header .fork { color:var(--other); }
aside { border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
aside h3 { margin:0; padding:8px 12px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--line); }
#events { flex:1; overflow:auto; font-size:12px; font-family: ui-monospace, Consolas, monospace; }
.ev { padding:5px 12px; border-bottom:1px solid #1d222d; display:grid; grid-template-columns: 44px 1fr; gap:8px; }
.ev .t { color:var(--dim); } .ev .k { color:var(--place); } .ev .who { color:var(--ink); } .ev .pl { color:var(--dim); white-space:pre-wrap; word-break:break-word; }
.ev.new { animation: flash 2.5s ease-out; }
@keyframes flash { from { background:#3a2a10; } to { background:transparent; } }
#detail { max-height:40%; overflow:auto; font-size:12px; font-family: ui-monospace, Consolas, monospace; padding:8px 12px; white-space:pre-wrap; word-break:break-word; color:var(--dim); border-top:1px solid var(--line); }
#detail b { color:var(--ink); }
.node rect { rx:8; fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
.node.place rect { stroke:var(--place); } .node.creature rect { stroke:var(--creature); } .node.thing rect { stroke:var(--thing); } .node.other rect { stroke:var(--other); }
.node.hidden rect { stroke-dasharray:4 3; opacity:.55; } .node.hidden text { opacity:.55; }
.node.me rect { stroke:var(--me); stroke-width:3; filter: drop-shadow(0 0 6px var(--me)); }
.node.changed rect { animation: pulse 2.5s ease-out; }
@keyframes pulse { from { fill:#4a3a1a; } to { fill:var(--panel); } }
.node text { fill:var(--ink); font-size:12px; pointer-events:none; }
.node text.sub { fill:var(--dim); font-size:10px; }
.node { cursor:pointer; }
.tree { stroke:var(--line); stroke-width:1.5; fill:none; }
.conn { stroke:var(--place); stroke-width:2; fill:none; opacity:.8; }
.rel { stroke:var(--other); stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
.lbl { fill:var(--dim); font-size:10px; }
.tag { fill:var(--me); font-size:10px; font-weight:600; }
.badge { fill:var(--hot); font-size:10px; }
.node text.stat { fill:#c9b98f; font-size:10px; }
.node text.stat.bad { fill:var(--hot); }
.node.asleep rect { stroke-dasharray:2 3; }
.node.down rect, .node.dead rect { stroke:var(--hot); }
.tag.away { fill:var(--dim); }
.ev .line { color:var(--ink); white-space:pre-wrap; word-break:break-word; }
#timers { color:var(--dim); }
</style>
</head>
<body>
<header>
  <b>embody watch</b>
  <select id="wsel" title="which world to watch"></select>
  <span id="fork" class="fork"></span>
  <span class="dim" id="folder" title="the world's folder in the workspace"></span>
  <span><span id="dot" class="dot"></span><span id="clock"></span></span>
  <span class="dim" id="counts"></span>
  <span id="timers" title="what the world clock has coming"></span>
  <span class="dim" id="err"></span>
  <span id="auth" hidden><input id="tok" type="password" placeholder="your invite token" size="30" autocomplete="off"> <button id="tokgo">watch</button></span>
  <span class="dim" id="where" title="database · workspace"></span>
</header>
<div id="graph"><svg id="svg"><g id="view"></g></svg>
  <div id="zoom"><button id="zin" title="zoom in">+</button><button id="zout" title="zoom out">−</button><button id="zfit" title="fit the whole world (or double-click the graph)">fit</button></div>
</div>
<aside>
  <h3>events</h3>
  <div id="events"></div>
  <h3>entity</h3>
  <div id="detail">click a box</div>
</aside>
<script>
const BOX_W = 170, BOX_H = 58, GAP_X = 14, GAP_Y = 84, PAD = 24, TOP = 70;
let lastSeq = -1, lastVersions = "", pinned = null, data = null, seenSeq = 0;
// Standalone (tools/watch.py) the page is the root of its own server and needs no token. Hosted, the MCP server
// serves it at /watch and its data answers only to a grant's bearer token, kept in this tab once given.
const BASE = /\/watch\/?$/.test(location.pathname) ? location.pathname.replace(/\/$/, "") : "";
let token = null;
try { token = sessionStorage.getItem("embody-token"); } catch (e) {}
if (location.hash.startsWith("#token=")) {      // an invite's viewer link: keep the token in the tab, drop it from the address
  token = decodeURIComponent(location.hash.slice(7));
  try { sessionStorage.setItem("embody-token", token); } catch (e) {}
  history.replaceState(null, "", location.pathname + location.search);
}
let watching = location.hash ? location.hash.slice(1) : null, knownWorlds = "";
const $ = id => document.getElementById(id);
async function get(path) {
  const r = await fetch(BASE + path, { cache: "no-store", headers: token ? { "Authorization": "Bearer " + token } : {} });
  if (r.status === 401 || r.status === 403) {
    const b = await r.json().catch(() => ({}));
    $("auth").hidden = false;
    $("err").textContent = r.status === 401 ? (token ? "that token does not open this world; paste a live one" : "this viewer wants your invite token") : (b.reason || "this grant may not watch");
    const e = new Error(b.reason || ("HTTP " + r.status)); e.auth = true; throw e;
  }
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function useToken() {
  token = $("tok").value.trim(); if (!token) return;
  try { sessionStorage.setItem("embody-token", token); } catch (e) {}
  $("tok").value = ""; $("auth").hidden = true; $("err").textContent = ""; lastSeq = -1; knownWorlds = ""; poll();
}

// ---- zoom and pan: one transform on the <g id="view">, kept across redraws, reset by fit
const cam = { k: 1, x: 0, y: 0, fitted: false, w: 0, h: 0 };
function applyCam() { $("view").setAttribute("transform", `translate(${cam.x},${cam.y}) scale(${cam.k})`); }
function fit() {
  const g = $("graph"), cw = g.clientWidth, ch = g.clientHeight;
  if (!cam.w || !cam.h) return;
  cam.k = Math.min(1.6, (cw - 16) / cam.w, (ch - 16) / cam.h);
  cam.x = (cw - cam.w * cam.k) / 2; cam.y = (ch - cam.h * cam.k) / 2 + 8;
  cam.fitted = true; applyCam();
}
function zoomAt(f, px, py) {
  const k = Math.min(6, Math.max(0.08, cam.k * f));
  cam.x = px - (px - cam.x) * (k / cam.k); cam.y = py - (py - cam.y) * (k / cam.k); cam.k = k;
  cam.fitted = false; applyCam();
}
(function wire() {
  const g = $("graph");
  g.addEventListener("wheel", ev => { ev.preventDefault(); const r = g.getBoundingClientRect(); zoomAt(ev.deltaY < 0 ? 1.15 : 1 / 1.15, ev.clientX - r.left, ev.clientY - r.top); }, { passive: false });
  let drag = null;
  g.addEventListener("mousedown", ev => { if (ev.button !== 0) return; drag = { x: ev.clientX, y: ev.clientY, cx: cam.x, cy: cam.y, moved: false }; g.classList.add("dragging"); });
  window.addEventListener("mousemove", ev => { if (!drag) return; const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; cam.x = drag.cx + dx; cam.y = drag.cy + dy; cam.fitted = false; applyCam(); });
  window.addEventListener("mouseup", () => { if (drag && drag.moved) suppressClick = true; drag = null; g.classList.remove("dragging"); });
  g.addEventListener("dblclick", fit);
  $("zin").onclick = () => zoomAt(1.3, g.clientWidth / 2, g.clientHeight / 2);
  $("zout").onclick = () => zoomAt(1 / 1.3, g.clientWidth / 2, g.clientHeight / 2);
  $("zfit").onclick = fit;
  window.addEventListener("resize", () => { if (cam.fitted) fit(); });
  $("tokgo").onclick = useToken; $("tok").addEventListener("keydown", ev => { if (ev.key === "Enter") useToken(); });
  get("/info.json").then(i => { $("where").textContent = [i.db, i.root].filter(Boolean).join(" · "); }).catch(() => {});
  $("wsel").onchange = () => { watching = $("wsel").value; location.hash = watching; lastSeq = -1; cam.fitted = false; cam.w = 0; pinned = null; poll(); };
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h !== watching) { watching = h; lastSeq = -1; cam.w = 0; poll(); } });
})();
let suppressClick = false;

function kindOf(e, schemas) {
  let t = e.type, guard = 0;
  while (t && guard++ < 20) { if (t === "place" || t === "creature" || t === "thing") return t; t = schemas[t]; }
  return "other";
}
function short(v, n = 90) { const s = typeof v === "string" ? v : JSON.stringify(v); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function nameOf(id) { if (!data || !id) return id || ""; const e = data.entities.find(x => x.id === id); return e ? (e.name || e.type) + " (" + e.id + ")" : id; }
function plain(id) { return nameOf(id).split(" (")[0]; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
let kidsBy = {};
function kidsOf(id) { return kidsBy[id] || []; }
function num(v) { return v === undefined || v === null ? null : Number(v); }
// a stack is that many of itself: Emberglass ×60
function label(e) { const c = num((e.state || {}).count); return (e.name || e.type) + (c !== null ? " ×" + c : ""); }
function labelOf(id) { const e = data && data.entities.find(x => x.id === id); return e ? label(e) : plain(id); }
// what keeps it shut: its own `locked`, or an attached lock child that is locked
function lockOf(e) { const st = e.state || {}; if (st.locked) return e; return kidsOf(e.id).find(k => k.state && k.state.attached && k.state.locked) || null; }
function bulkOf(e) { const st = e.state || {}; const each = st.bulk !== undefined && st.bulk !== null ? Number(st.bulk) : (st.capacity !== undefined && st.capacity !== null ? 2 : 1); return each * (num(st.count) ?? 1); }
function hm(sec) { sec = Math.max(0, sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); return h ? h + "h" + (m ? String(m).padStart(2, "0") : "") : m + "m"; }
function ago(sec) { return sec < 90 ? Math.round(sec) + "s" : sec < 5400 ? Math.round(sec / 60) + "m" : (sec / 3600).toFixed(1) + "h"; }
// the box's status line: a body's water and vigor and what is wrong with it, a stack, a lock, a well's level,
// a hidden place and who knows it, a works' stage and labour
function status(e, k) {
  const st = e.state || {}, out = [], bad = [];
  if (st.water !== undefined && st.water !== null && k === "creature") {
    out.push("w " + st.water + "/" + (st.max_water ?? 10), "v " + (st.vigor ?? "?") + "/" + (st.max_vigor ?? 6));
  } else if (st.hp !== undefined) out.push("hp " + st.hp);
  ["dead", "down", "asleep", "wounded", "thirsty"].forEach(f => { if (st[f]) bad.push(f); });
  if (st.left !== undefined && st.left !== null && (st.capacity !== undefined || st.water_source || st.max_left !== undefined))
    out.push("left " + st.left + ((st.capacity ?? st.max_left) !== undefined ? "/" + (st.capacity ?? st.max_left) : ""));
  else if (st.water_source) out.push("water, endless");
  const lk = lockOf(e);
  if (lk) bad.push("🔒 locked");
  else if (st.broken && (e.type === "lock" || st.attached)) bad.push("lock broken");
  else if (kidsOf(e.id).some(c => c.state && c.state.attached && c.state.broken)) out.push("lock broken");
  if (st.hidden) out.push("hidden" + (st.known_to ? " · " + st.known_to : "") + (st.find_dc ? " · dc " + st.find_dc : ""));
  if (Array.isArray(st.stages)) {
    const i = num(st.stage);
    if (i === null) out.push("plan · " + st.stages.length + " stages");
    else {
      const sg = st.stages[i];
      out.push(sg ? "stage " + (i + 1) + "/" + st.stages.length + " " + (sg.name || "") + " · " + (Math.round((num(st.labour) ?? 0) * 10) / 10) + "/" + (sg.labour ?? "?") + "h" : "built");
    }
  } else if (st.stage !== undefined && st.stage !== null) out.push("stage " + st.stage);
  if (st.lit) out.push("lit"); if (st.fog) out.push("fog");
  return { text: bad.concat(out).join(" · "), bad: bad.length > 0, flags: ["dead", "down", "asleep"].filter(f => st[f]) };
}
// a seat in a word: whose it is, the role, and whether it is in use
function seatTag(p, w) {
  const who = p.label || p.name || p.id;
  const idle = p.acted_t === null || p.acted_t === undefined || w.t - p.acted_t > w.idle_after;
  const seen = p.last_seen ? " · seen " + ago(w.now - p.last_seen) + " ago" : "";
  return { text: who + (p.role ? " · " + p.role : "") + (idle ? " · away" : " · in play") + seen, away: idle };
}

function layout(d) {
  const byParent = {};
  d.entities.forEach(e => { (byParent[e.parent || "__none"] ||= []).push(e); });
  const size = {}, rowsOf = {};
  const COLS = 3;
  const measure = e => {
    const kids = byParent[e.id] || [];
    if (!kids.length) { size[e.id] = { w: BOX_W, h: BOX_H }; return size[e.id]; }
    kids.forEach(measure);
    const rows = []; for (let i = 0; i < kids.length; i += COLS) rows.push(kids.slice(i, i + COLS));
    rowsOf[e.id] = rows.map(r => ({ kids: r, w: r.reduce((a, k) => a + size[k.id].w, 0) + GAP_X * (r.length - 1), h: Math.max(...r.map(k => size[k.id].h)) }));
    size[e.id] = { w: Math.max(BOX_W, ...rowsOf[e.id].map(r => r.w)), h: BOX_H + rowsOf[e.id].reduce((a, r) => a + GAP_Y + r.h, 0) };
    return size[e.id];
  };
  const roots = d.entities.filter(e => !e.parent || !d.entities.some(x => x.id === e.parent));
  roots.forEach(measure);
  const pos = {};
  const place = (e, x, y) => {
    const s = size[e.id];
    pos[e.id] = { x: x + s.w / 2 - BOX_W / 2, y };
    let cy = y + BOX_H + GAP_Y;
    (rowsOf[e.id] || []).forEach(r => { let rx = x + (s.w - r.w) / 2; r.kids.forEach(k => { place(k, rx, cy); rx += size[k.id].w + GAP_X; }); cy += r.h + GAP_Y; });
  };
  let x = PAD, maxH = 0; roots.forEach(r => { place(r, x, TOP); x += size[r.id].w + GAP_X * 3; maxH = Math.max(maxH, size[r.id].h); });
  return { pos, totalW: x + PAD, totalH: TOP + maxH + PAD };
}

function render(d, changed) {
  const { pos, totalW, totalH } = layout(d);
  const svg = $("view");
  const firstDraw = !cam.w;
  cam.w = totalW; cam.h = totalH;
  const me = {}; d.principals.forEach(p => { if (p.entity) me[p.entity] = p; });
  kidsBy = {}; d.entities.forEach(e => { if (e.parent) (kidsBy[e.parent] ||= []).push(e); });
  let out = "";
  d.entities.forEach(e => {
    if (e.parent && pos[e.parent]) {
      const a = pos[e.parent], b = pos[e.id];
      const ax = a.x + BOX_W / 2, ay = a.y + BOX_H, bx = b.x + BOX_W / 2, by = b.y;
      out += `<path class="tree" d="M${ax},${ay} C${ax},${ay + GAP_Y / 2} ${bx},${by - GAP_Y / 2} ${bx},${by}"/>`;
    }
  });
  const seen = new Set();
  d.edges.forEach(ed => {
    const a = pos[ed.source], b = pos[ed.target]; if (!a || !b) return;
    const conn = ed.relation === "connects_to";
    const key = [ed.source, ed.target].sort().join("|") + ed.relation;
    if (conn && seen.has(key)) return; seen.add(key);
    const ax = a.x + BOX_W / 2, bx = b.x + BOX_W / 2, mx = (ax + bx) / 2;
    if (conn) {
      const lift = 40 + Math.abs(ax - bx) * 0.12, my = Math.min(a.y, b.y) - lift;
      out += `<path class="conn" d="M${ax},${a.y} Q${mx},${my} ${bx},${b.y}"/>`;
      const via = ed.data && ed.data.via ? "via " + plain(ed.data.via) : "";
      if (via) out += `<text class="lbl" x="${mx}" y="${(a.y + my) / 2}" text-anchor="middle">${esc(via)}</text>`;
    } else {
      const drop = 30 + Math.abs(ax - bx) * 0.1, my = Math.max(a.y, b.y) + BOX_H + drop;
      out += `<path class="rel" d="M${ax},${a.y + BOX_H} Q${mx},${my} ${bx},${b.y + BOX_H}"/>`;
      out += `<text class="lbl" x="${mx}" y="${my - drop / 2 + 12}" text-anchor="middle">${esc(ed.relation)}</text>`;
    }
  });
  d.entities.forEach(e => {
    const p = pos[e.id]; if (!p) return;
    const k = kindOf(e, d.schemas), st = e.state || {};
    const s = status(e, k);
    const cls = ["node", k, st.hidden ? "hidden" : "", me[e.id] ? "me" : "", changed.has(e.id) ? "changed" : ""].concat(s.flags).join(" ");
    out += `<g class="${cls}" data-id="${e.id}" transform="translate(${p.x},${p.y})"><title>${esc(label(e) + (s.text ? "\n" + s.text : ""))}</title><rect width="${BOX_W}" height="${BOX_H}"/>`;
    out += `<text x="10" y="18">${esc(short(label(e), 23))}</text><text class="sub" x="10" y="33">${esc(short(e.type + " · " + e.id, 30))}</text>`;
    if (s.text) out += `<text class="stat${s.bad ? " bad" : ""}" x="10" y="48">${esc(short(s.text, 30))}</text>`;
    if (me[e.id]) { const t = seatTag(me[e.id], d.world); out += `<text class="tag${t.away ? " away" : ""}" x="${BOX_W - 6}" y="-5" text-anchor="end">${esc(short(t.text, 40))} ◀</text>`; }
    if (st.rules && st.rules.length) out += `<text class="badge" x="${BOX_W - 6}" y="33" text-anchor="end">⚖ ${st.rules.length}</text>`;
    out += `</g>`;
  });
  d.hyperedges.forEach((h, i) => {
    out += `<text class="lbl" x="${PAD}" y="${18 + i * 14}">${esc(h.relation)}: ${esc(h.participants.map(plain).join(", "))}</text>`;
  });
  svg.innerHTML = out;
  svg.querySelectorAll(".node").forEach(n => n.addEventListener("click", () => { if (suppressClick) { suppressClick = false; return; } pinned = n.dataset.id; showDetail(); }));
  if (firstDraw || cam.fitted) fit(); else applyCam();
}

async function refreshWorlds() {
  const ws = await get("/worlds.json");
  const key = ws.map(w => w.id + ":" + w.name + ":" + w.built).join("|");
  if (key === knownWorlds) return ws;
  knownWorlds = key;
  $("wsel").innerHTML = ws.map(w => `<option value="${esc(w.id)}"${w.built === false ? " disabled" : ""}>${esc(w.name)} (${esc(w.id)})${w.forked_from ? " ⑂" : ""}${w.built === false ? " · not built: load_world(id)" : ""}</option>`).join("");
  return ws;
}

function showDetail() {
  if (!data || !pinned) return;
  const e = data.entities.find(x => x.id === pinned);
  if (!e) { $("detail").textContent = pinned + " no longer exists"; return; }
  const kidRows = data.entities.filter(x => x.parent === e.id), st = e.state || {};
  const kids = kidRows.map(label);
  const rel = data.edges.filter(x => x.source === e.id || x.target === e.id).map(x => plain(x.source) + " -" + x.relation + "-> " + plain(x.target));
  let txt = `<b>${esc(label(e))}</b> ${esc(e.id)} : ${esc(e.type)}  v${e.version}\n`;
  const s = status(e, kindOf(e, data.schemas));
  if (s.text) txt += esc(s.text) + "\n";
  txt += `in: ${esc(e.parent ? nameOf(e.parent) : "(root)")}\nholds: ${esc(kids.join(", ") || "nothing")}\n`;
  if (st.carry !== undefined && st.carry !== null) txt += `carries: ${Math.round(kidRows.reduce((a, c) => a + bulkOf(c), 0) * 100) / 100} of ${st.carry}\n`;
  const lk = e.type === "lock" ? e : (lockOf(e) || kidRows.find(c => c.type === "lock"));
  if (lk) { const ls = lk.state || {}; txt += `lock: ${esc(lk.name)}${ls.locked ? " · locked" : " · open"}${ls.broken ? " · broken" : ""}${ls.key ? " · key " + esc(labelOf(ls.key)) : ""}${ls.code ? " · code set" : ""}${ls.pick_dc ? " · pick dc " + ls.pick_dc : ""}${ls.break_dc ? " · break dc " + ls.break_dc : ""}${ls.picking ? " · being picked by " + esc(plain(ls.picking.who)) : ""}\n`; }
  const seat = data.principals.filter(p => p.entity === e.id);
  seat.forEach(p => { txt += "seat: " + esc(seatTag(p, data.world).text) + "\n"; });
  if (rel.length) txt += "edges: " + esc(rel.join("\n       ")) + "\n";
  txt += "state: " + esc(JSON.stringify(e.state, null, 1));
  $("detail").innerHTML = txt;
}

// one readable line for the events people care about; the raw payload stays in the tooltip
function line(ev) {
  const p = ev.payload || {}, a = ev.actor ? plain(ev.actor) : "", t = ev.target ? plain(ev.target) : "";
  const n = p.count !== undefined && p.count !== null ? p.count + " " : "";
  const by = p.by ? plain(p.by) : a;
  const bare = id => labelOf(id).replace(/ ×\d+(\.\d+)?$/, "");
  switch (ev.kind) {
    case "taken": return `${by} took ${n}${bare(p.item || ev.target)}` + (p.source && p.source !== p.by ? " from " + plain(p.source) : "");
    case "dropped": return `${by} dropped ${n}${bare(p.item || ev.target)}`;
    case "given": return `${by} gave ${n}${bare(p.item)} to ${t}`;
    case "put": return `${by} put ${n}${bare(p.item)} in ${t}`;
    case "burned": return `${by} burned ${p.count > 1 ? p.count + " " : ""}${p.name || "something"}`;
    case "renamed": return `${p.old} is now ${p.new}`;
    case "slept": return `${t} fell asleep`;
    case "woke": return `${t} woke` + (p.why ? " (" + p.why + (p.by && p.by !== ev.target ? ", " + plain(p.by) : "") + ")" : "");
    case "unlocked": case "locked": return `${by} ${ev.kind} ${p.lock ? plain(p.lock) : t}`;
    case "lock_picked": return `${by} picked ${plain(p.lock)} (${p.total} vs ${p.dc})`;
    case "pick_failed": return `${by} failed to pick ${plain(p.lock)} (${p.total} vs ${p.dc}), heard`;
    case "lock_broken": return `${by} broke ${plain(p.lock)} open`;
    case "break_failed": return `${by} hammered at ${plain(p.lock)}, it held`;
    case "searched": return `${by} searched ${t}: ${(p.found || []).length} taken` + ((p.left || []).length ? `, ${p.left.length} left` : "");
    case "lifted": return `${by} lifted ${(p.found || []).length} things off ${plain(p.sleeper)}, unseen`;
    case "caught": return `${by} was caught reaching for ${t}'s things`;
    case "merged": return `${t} gathers ${p.count} more (${p.total})`;
    case "hit": return `${by} hit ${t} for ${p.dmg}${p.weapon ? " with " + p.weapon : ""} (${p.attack} vs ${p.defence})${p.asleep ? ", asleep" : ""}`;
    case "downed": return `${t} went down` + (p.by ? " (" + plain(p.by) + ")" : "");
    case "wounded": return `${t} is wounded` + (p.by ? " (" + plain(p.by) + ")" : "");
    case "rose": return `${t} is back on their feet`;
    case "missed": return `${by} missed ${t} (${p.attack} vs ${p.defence})`;
    case "say": return `${a}${p.to ? " to " + plain(p.to) : ""}: "${short(p.text || "", 160)}"`;
    case "arrived": return `${plain(p.who || ev.actor)} arrived at ${plain(p.place || ev.target)}${p.quiet ? " (quiet)" : ""}`;
  }
  return null;
}

function renderEvents(d) {
  let html = "";
  d.events.slice().reverse().forEach(ev => {
    const who = [ev.actor ? plain(ev.actor) : "", ev.target ? "→ " + plain(ev.target) : ""].join(" ").trim();
    const raw = ev.payload && Object.keys(ev.payload).length ? JSON.stringify(ev.payload) : "";
    let ln = null; try { ln = line(ev); } catch (e) { ln = null; }
    const pl = raw ? short(ev.payload, 140) : "";
    html += `<div class="ev ${ev.seq > seenSeq ? "new" : ""}" title="${esc(raw)}"><span class="t">${ev.t.toFixed(1)}</span><span><span class="k">${esc(ev.kind)}</span> <span class="who">${esc(ln ? "" : who)}</span> <span class="dim">#${ev.seq} r${ev.reach}</span>`;
    if (ln) html += `<div class="line">${esc(ln)}</div>`;
    else if (pl) html += `<div class="pl">${esc(pl)}</div>`;
    html += `</span></div>`;
  });
  $("events").innerHTML = html;
}

async function poll() {
  try {
    await refreshWorlds();
    const want = watching;
    const d = await get("/state.json?limit=80" + (want ? "&world=" + encodeURIComponent(want) : ""));
    if (!d.ok) { $("err").textContent = d.reason; return; }
    if (BASE) $("where").textContent = "";       // hosted: one world behind a token; the first fetch may have shown it
    if (watching !== want) return;              // the user switched worlds while this poll was in flight
    $("err").textContent = "";
    const versions = d.entities.map(e => e.id + ":" + e.version + ":" + e.parent).join(",");
    const w = d.world;
    if (!want) { watching = w.id; }             // no pick yet: the server chose the newest world
    if ($("wsel").value !== w.id) $("wsel").value = w.id;
    $("fork").textContent = w.forked_from ? "forked from " + w.forked_from.world + " at t=" + Number(w.forked_from.t).toFixed(1) + " (seq " + w.forked_from.seq + ")" : "";
    $("folder").textContent = w.folder || "";
    const day = w.day_seconds || 86400, root = d.entities.find(e => e.id === w.root), amb = (root && root.state && root.state.ambient) || {};
    const tod = w.t % day, clockTxt = "day " + (Math.floor(w.t / day) + 1) + " · " + String(Math.floor(tod / 3600)).padStart(2, "0") + ":" + String(Math.floor(tod % 3600 / 60)).padStart(2, "0") + (amb.time_of_day ? " · " + amb.time_of_day : "");
    $("clock").textContent = clockTxt + " · t=" + w.t.toFixed(0) + (w.running ? " · x" + w.rate : (" · paused" + (w.turn ? " · turn " + w.turn + "s" : "")));
    $("dot").className = "dot" + (w.running ? " run" : "");
    $("counts").textContent = d.entities.length + " entities · " + d.edges.length + " edges · " + d.max_seq + " events · " + d.principals.length + (d.principals.length === 1 ? " principal" : " principals");
    // timers by kind, soonest first: the story's (dusk, the moon, a muster), not the bodies' ticks
    const next = {}; let ticks = 0;
    d.scheduled.forEach(s => {
      if (s.kind === "tick" || s.kind === "finish") { ticks++; return; }
      const nm = (s.payload && (s.payload.name || s.payload.event || s.payload.script)) || "";
      const key = s.kind + (nm && nm !== s.kind ? " " + nm : "");
      if (!next[key] || s.t < next[key].t) next[key] = { t: s.t, every: s.every, n: (next[key] ? next[key].n : 0) + 1 }; else next[key].n++;
    });
    const tl = Object.entries(next).sort((a, b) => a[1].t - b[1].t);
    $("timers").textContent = (tl.length ? "coming: " + tl.slice(0, 6).map(([k, v]) => k + " in " + hm(v.t - w.t) + (v.n > 1 ? " (" + v.n + ")" : "")).join(" · ") + (tl.length > 6 ? " · +" + (tl.length - 6) : "") : "") + (ticks ? " · " + ticks + " ticks" : "");
    $("timers").title = tl.map(([k, v]) => k + " at t=" + v.t.toFixed(0) + (v.every ? " every " + hm(v.every) : "")).join("\n");
    if (d.max_seq !== lastSeq || versions !== lastVersions) {
      const changed = new Set(d.entities.filter(e => data && e.updated_seq > lastSeq).map(e => e.id));
      data = d; render(d, changed); renderEvents(d); showDetail();
      seenSeq = d.max_seq; lastSeq = d.max_seq; lastVersions = versions;
    }
  } catch (e) { if (!e.auth) $("err").textContent = "no server: " + e.message; }
}
poll(); setInterval(poll, 1000);
</script>

</html>
